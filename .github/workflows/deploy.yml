name: deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NEXT_PUBLIC_SITE_URL: https://ayush-gzip.dev

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npx tsc --noEmit
      # npm run build, not next build: prebuild runs the security check,
      # postbuild writes the CSP into _headers plus sitemap and feed.
      - run: npm run build
      - name: Output must not leak identity or local paths
        run: |
          if grep -rnE '\+91|/Users/' out; then exit 1; fi
          test -f out/_headers && grep -q 'Content-Security-Policy' out/_headers
          test -f out/sitemap.xml && test -f out/feed.xml
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site
          path: out
          retention-days: 7

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: ${{ steps.cf.outputs.deployment-url }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: site
          path: out
      - id: cf
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy out --project-name=portfolio-terminal --branch=main --commit-dirty=true
      - name: Smoke check
        env:
          URL: ${{ steps.cf.outputs.deployment-url }}
        run: |
          for i in 1 2 3 4 5 6; do
            curl -sfI "$URL/" | grep -qi '^content-security-policy:' && break
            [ "$i" = 6 ] && { echo "CSP header missing on $URL"; exit 1; }
            sleep 10
          done
          curl -sf -o /dev/null "$URL/sitemap.xml"
          test "$(curl -s -o /dev/null -w '%{http_code}' "$URL/_headers")" = 404
